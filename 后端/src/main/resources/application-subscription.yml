# =========================================================
# 订阅模块专属配置
# （文档《订阅模块本地开发实现指南》要求的独立配置文件，
#   由 application.yml 中 spring.profiles.include: subscription 自动加载）
# =========================================================
app:
  quota:
    # 额度计数器存储：
    #   auto  = 优先 Redis（Lua 原子扣减），连不上时自动降级为数据库计数器（比赛环境无 Redis 也能跑）
    #   redis = 强制 Redis，连不上直接报错
    #   db    = 强制数据库计数器
    store: auto
  subscribe:
    # 比赛模式：跳过真实支付，下单即激活套餐（对接支付后改为 false，走支付回调激活）
    skip-payment: true
    # 订阅到期检查（自动回落免费级）cron 表达式：每小时整点执行
    expire-check-cron: "0 0 * * * ?"
    # 支付模块：模拟支付 + 可切换真实接口（营业执照办理后把 channel 改成 alipay/wechat 即切换）
    payment:
      channel: mock
      # 支付宝参数占位（办理营业执照后填写）
      alipay-app-id: ""
      alipay-notify-url: ""
      alipay-return-url: ""
      alipay-public-key: ""
      app-private-key: ""
      # 微信支付参数占位（办理营业执照后填写）
      wechat-app-id: ""
      wechat-mch-id: ""
      wechat-notify-url: ""
      wechat-api-key: ""
