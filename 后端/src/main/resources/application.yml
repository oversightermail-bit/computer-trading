# =========================================================
# 硬件价格比价与智能推荐网站 - 后端主配置
# 订阅/额度相关配置见 application-subscription.yml
# 启动前请修改 spring.datasource 的账号密码为本机 MySQL 账号
# =========================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: hw-price-backend
  # 加载订阅模块专属配置（文档《订阅模块本地开发实现指南》要求该文件独立存在）
  profiles:
    include: subscription

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：数据库不存在时自动创建
    # 注意：characterEncoding 须为 Java 字符集名（utf8），Connector/J 会自动使用 utf8mb4 连接
    url: jdbc:mysql://localhost:3306/hw_price?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库账号走最小权限：环境变量 DB_USER / DB_PASSWORD 注入（本地由 backend-env.bat 提供 hwapp 账号）
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，比赛演示如不需要可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 应用自定义配置
app:
  security:
    # 根管理员 Controler 初始密码：环境变量 ADMIN_INIT_PASSWORD 注入（本地见 backend-env.bat，不入库）；为空则跳过初始化
    admin-init-password: "${ADMIN_INIT_PASSWORD:}"
    # CORS 允许来源（逗号分隔）：空 = 开发期全放行（file:// 演示需要）；部署时设置如 https://your.domain
    cors-allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
  jwt:
    # HS256 签名密钥（>= 32 字节）：通过环境变量 JWT_SECRET 注入
    # （本地由项目根目录 backend-env.bat 提供，已 gitignore 不入库）
    secret: "${JWT_SECRET}"
    # token 有效期（小时）
    expire-hours: 168
  ai:
    # 运行时路由：管理员在管理页配置 API 密钥（t_app_config.ai.apiKey）
    # 即走 OpenAI 兼容云端大模型；未配置密钥自动回落本地 Mock 演示模型。
    # 接口地址与模型名**没有默认值**，必须由管理员在管理页填写（任意
    # OpenAI 兼容网关，如 DeepSeek/通义/Kimi 等），填写密钥时同步必填。
    # 回答压缩后的最大字符数（"简短的大白话"约束）
    compress-max-chars: 500
    timeout-seconds: 30
  crawler:
    # 管理页"启动爬虫"按钮：工作目录 + 命令（只写真实采集价，采不到显示暂无数据）
    work-dir: "../爬虫"
    command: "python run.py once --mode real"
    # 管理页"开启定时抓取"按钮（服务器长期运行用）：常驻调度进程，每日 08/12/18/22 点各抓一轮
    schedule-command: "python run.py schedule --mode real"
  cache:
    # 价格折线数据在 Redis 中的缓存时间（分钟）
    price-ttl-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 部署时设置环境变量 SWAGGER_ENABLED=false 关闭接口文档
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.hwprice: info
